bundle:
  name: icd10-gapanalysis-demo

variables:
  catalog:
    default: my_catalog
    description: Unity Catalog name
  schema:
    default: icd10_care_gap
    description: Schema name (single schema used for all tables and the icd10_reference_pdfs volume)
  ai_gateway_route:
    default: care-gap-advisor
    description: AI Gateway route name for the care gap model
  warehouse_id:
    default: "<your-warehouse-id>"
    description: >
      SQL warehouse ID used by the Databricks App for Delta queries.
      Referenced in app/app.yaml resources block — databricks apps deploy
      automatically grants the app SP CAN_USE on this warehouse.
  data_setup_job_name:
    default: "ICD-10 Gap Demo — Data Setup"
    description: Job 1 — catalog creation + patient data + PDF upload (standard cluster, FUSE mounts)
  ai_setup_job_name:
    default: "ICD-10 Gap Demo — AI Setup"
    description: Job 2 — Knowledge Assistant + AI Gateway (serverless, SDK only)
  secret_scope:
    default: care-gap-demo
    description: Databricks secret scope containing anthropic-api-key (used by AI Setup if model_provider=anthropic)
  model_provider:
    default: databricks
    description: Foundation model provider for care gap route — "databricks" (FMAPI, no key needed) or "anthropic" (external key via secret scope)
  app_service_principal:
    default: ""
    description: >
      Application ID (client_id UUID) of the Databricks App service principal.
      Do not hardcode — deploy.sh reads this from the live app after apps deploy.
      Pass via: databricks bundle deploy --var="app_service_principal=$(databricks apps get icd10-gap-advisor ... | jq -r .service_principal_client_id)"
  ka_name:
    default: "ICD-10 Clinical Reference Assistant"
    description: Display name of the Databricks Knowledge Assistant created in setup step 4
  pdf_github_url:
    default: "https://github.com/kuldeep-in/icd10-gapanalysis-demo/tree/main/data/icd10_pdfs"
    description: >
      GitHub tree URL of the directory containing ICD-10 PDF reference files.
      The notebook uses the GitHub Contents API to list and stream-download all PDFs
      directly into the Unity Catalog Volume — no local storage or bundle packaging needed.
      Format: https://github.com/<owner>/<repo>/tree/<branch>/<path>

targets:
  dev:
    mode: development
    workspace:
      host: https://adb-7405615754965401.1.azuredatabricks.net

include:
  - resources/*.yml
