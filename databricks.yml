bundle:
  name: icd10-gapanalysis-demo

variables:
  catalog:
    default: icd10_gap_demo
    description: Unity Catalog name
  ai_gateway_route:
    default: care-gap-advisor
    description: AI Gateway route name for the care gap model
  warehouse_id:
    default: ""
    description: SQL warehouse ID used by the Databricks App for Delta queries
  bootstrap_job_name:
    default: "ICD-10 Gap Demo — Bootstrap"
    description: Display name of the bootstrap workflow job
  secret_scope:
    default: care-gap-demo
    description: Databricks secret scope containing anthropic-api-key (used by step 5 if model_provider=anthropic)
  model_provider:
    default: anthropic
    description: Foundation model provider for care gap route — "anthropic" or "databricks" (DBRX Instruct)

targets:
  dev:
    mode: development
    workspace:
      host: https://adb-7405615754965401.1.azuredatabricks.net

include:
  - resources/*.yml
