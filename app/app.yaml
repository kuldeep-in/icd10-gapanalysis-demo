command: ["python", "app.py"]

env:
  - name: UC_CATALOG
    value: "my_catalog"
  - name: UC_SCHEMA
    value: "icd10_care_gap"
  - name: AI_GATEWAY_ROUTE
    value: "databricks-claude-sonnet-4-6"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "<your-warehouse-id>"
  - name: DATA_SETUP_JOB_NAME
    value: "ICD-10 Gap Demo — Data Setup"
  - name: AI_SETUP_JOB_NAME
    value: "ICD-10 Gap Demo — AI Setup"
  - name: KA_NAME
    value: "ICD-10 Clinical Reference Assistant"

resources:
  - name: "sql-warehouse"
    description: "SQL warehouse for bootstrap status queries and validation"
    sql_warehouse:
      id: "<your-warehouse-id>"
      permission: "CAN_USE"
