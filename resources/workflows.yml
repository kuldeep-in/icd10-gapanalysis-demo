resources:
  jobs:

    # ── Job 1: Data Setup (Serverless) ────────────────────────────────────────
    # All tasks use spark.read / dbutils.fs — no FUSE mounts, no cluster needed.
    # Run this job first, then run the AI Setup job.
    bootstrap_data_setup:
      name: ${var.data_setup_job_name}
      description: >
        Job 1 of 2 — Creates Unity Catalog structure, ingests patient clinical notes,
        and uploads ICD-10 PDFs to the UC Volume. Runs entirely on serverless compute.

      environments:
        - environment_key: default
          spec:
            client: "1"

      permissions:
        - service_principal_name: ${var.app_service_principal}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: create_catalog
          description: Create Unity Catalog, schema, all Delta tables, UC Volume, and grant app SP permissions
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/01_create_catalog
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              app_sp_id: ${var.app_service_principal}

        - task_key: setup_care_gap_rules
          description: Seed care_gap_rules table with HEDIS/ACC/ADA evidence-based clinical rules
          depends_on:
            - task_key: create_catalog
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/02_setup_care_gap_rules
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: ingest_patient_data
          description: Load patient_records.json via spark.read.json into patient_records table
          depends_on:
            - task_key: create_catalog
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/02_ingest_patient_json
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: load_icd10_pdfs
          description: Download ICD-10 PDFs from GitHub and stream directly into the icd10_reference UC Volume
          depends_on:
            - task_key: create_catalog
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/03_load_icd10_pdfs_to_volume
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              pdf_github_url: ${var.pdf_github_url}

    # ── Job 2: AI Setup (Serverless) ──────────────────────────────────────────
    # Pure SDK calls — Knowledge Assistant and AI Gateway configuration.
    # Run after the Data Setup job completes.
    bootstrap_ai_setup:
      name: ${var.ai_setup_job_name}
      description: >
        Job 2 of 2 — Creates the ICD-10 Knowledge Assistant and configures the AI
        Gateway serving endpoint. Runs on serverless compute.
        Run after the Data Setup job completes.

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.28.0

      permissions:
        - service_principal_name: ${var.app_service_principal}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: create_knowledge_assistant
          description: Create KA agent, attach UC Volume as knowledge source, trigger PDF sync
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/04_create_knowledge_assistant
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ka_name: ${var.ka_name}

        - task_key: configure_ai_gateway
          description: Create the AI Gateway serving endpoint for the care gap foundation model
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/05_configure_ai_gateway
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ai_gateway_route: ${var.ai_gateway_route}
              secret_scope: ${var.secret_scope}
              model_provider: ${var.model_provider}

