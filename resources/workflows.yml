resources:
  jobs:

    # ── Job 1: Data Setup (Serverless) ────────────────────────────────────────
    # All tasks use spark.read / dbutils.fs — no FUSE mounts, no cluster needed.
    # Run this job first, then run the AI Setup job.
    bootstrap_data_setup:
      name: ${var.data_setup_job_name}
      description: >
        Job 1 of 2 — Seeds care gap rules, ingests patient clinical notes,
        builds the VS index and configures the Genie Space. Catalog, schema, tables
        and UC permissions are all created by deploy.sh at deployment time.

      tags:
        Demo: icd10-gapanalysis

      environments:
        - environment_key: default
          spec:
            client: "1"

      permissions:
        - service_principal_name: ${var.app_service_principal}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: setup_care_gap_rules
          description: Seed care_gap_rules table with HEDIS/ACC/ADA evidence-based clinical rules
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/02_setup_care_gap_rules
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              app_sp_id: ${var.app_service_principal}

        - task_key: ingest_patient_data
          description: Load patient_records.json via spark.read.json into patient_records table
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/02_ingest_patient_json
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: create_vs_index
          description: Add embedding_text to care_gap_rules and create Vector Search index for semantic rule retrieval
          depends_on:
            - task_key: setup_care_gap_rules
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/06_create_care_gap_vs_index
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              app_sp_id: ${var.app_service_principal}
              vs_endpoint_name: ${var.vs_endpoint_name}

        - task_key: configure_genie_space
          description: Register patient_records, icd10_analysis_results, care_gap_findings and care_gap_rules tables to the Genie Space
          depends_on:
            - task_key: create_vs_index
            - task_key: ingest_patient_data
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/07_configure_genie_space
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              genie_space_id: ${var.genie_space_id}
              app_sp_id: ${var.app_service_principal}

    # ── Job 2: Knowledge Assistant Setup (Serverless) ────────────────────────
    # Uploads ICD-10 PDFs to the UC Volume and attaches the volume to the KA.
    # Knowledge Assistant is created by setup_resources.py (pre-deploy) — not here.
    # Run after the Data Setup job completes.
    bootstrap_ai_setup:
      name: ${var.ai_setup_job_name}
      description: >
        Job 2 of 2 — Uploads ICD-10 reference PDFs to the UC Volume, then attaches the
        volume to the Knowledge Assistant and triggers PDF indexing.
        The Knowledge Assistant is pre-created by setup_resources.py during deploy.
        Runs on serverless compute. Run after the Data Setup job completes.

      tags:
        Demo: icd10-gapanalysis

      environments:
        - environment_key: default
          spec:
            client: "1"

      permissions:
        - service_principal_name: ${var.app_service_principal}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: load_icd10_pdfs
          description: Download ICD-10 PDFs from GitHub and stream directly into the icd10_reference UC Volume
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/03_load_icd10_pdfs_to_volume
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              pdf_github_url: ${var.pdf_github_url}

        - task_key: configure_knowledge_source
          description: Attach ICD-10 reference PDFs UC Volume to Knowledge Assistant and trigger sync
          depends_on:
            - task_key: load_icd10_pdfs
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/setup/04_configure_knowledge_source
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ka_endpoint_name: ${var.ka_endpoint_name}

